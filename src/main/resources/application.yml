spring:
  application:
    name: lezitech-suite-api
  datasource:
    # The app connects as suite_app, a non-owner role, so Row-Level Security applies.
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:54329/suite}
    username: ${DATABASE_USERNAME:suite_app}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrations run as the schema owner on their own connection.
    url: ${FLYWAY_URL:${DATABASE_URL:jdbc:postgresql://127.0.0.1:54329/suite}}
    user: ${FLYWAY_USERNAME:postgres}
    password: ${FLYWAY_PASSWORD:}
  jackson:
    default-property-inclusion: always

server:
  port: ${PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Status of each part (database, disk) without exposing details publicly.
      show-components: always
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: true

suite:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-before-any-real-deploy-0123456789}
    ttl-hours: ${JWT_TTL_HOURS:12}
  trial-days: ${TRIAL_DAYS:7}
  demo:
    # One-click demo workspaces per sector for pilots and sales demos.
    enabled: ${DEMO_LOGINS:true}
  admin:
    # First superadmin, created on startup if no LeziTech admin exists yet.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    # One-click control-panel role logins; only ever on for local runs (embedded database).
    demo-logins: ${ADMIN_DEMO_LOGINS:${EMBEDDED_DB:true}}
  operator-key: ${OPERATOR_KEY:local-operator-key}
  # Where the web app lives (links in emails) and LeziTech's WhatsApp number shown to customers.
  app-url: ${APP_URL:http://localhost:5320}
  support-whatsapp: ${SUPPORT_WHATSAPP:}
  # Trial reminder emails: EMAIL_PROVIDER off | log | brevo | resend (+ EMAIL_API_KEY, EMAIL_FROM).
  email:
    provider: ${EMAIL_PROVIDER:off}
    api-key: ${EMAIL_API_KEY:}
    from: ${EMAIL_FROM:}
    from-name: ${EMAIL_FROM_NAME:LeziTech}
  # KRA eTIMS: off | stub (test numbers, not valid for tax). The real OSCU/VSCU client needs KRA approval first.
  etims:
    mode: ${ETIMS_MODE:off}
    retry-ms: ${ETIMS_RETRY_MS:60000}
  # Encrypts each business's payment and SMS keys (AES-256-GCM). 32 random bytes, base64: openssl rand -base64 32.
  # Required on a real database; never change it once businesses have saved keys.
  secrets-key: ${SECRETS_KEY:}
  # M-Pesa prompts. MPESA_MODE: off | on | simulate (simulate = local demo, refused on a real database).
  # Each business's till prompts use its own Daraja app or PayHero account (Settings, Payments).
  # The MPESA_CONSUMER_KEY/SECRET/SHORTCODE/PASSKEY below are LeziTech's own paybill, used for plan payments
  # only when PayHero isn't set.
  mpesa:
    mode: ${MPESA_MODE:off}
    base-url: ${MPESA_BASE_URL:https://sandbox.safaricom.co.ke}
    consumer-key: ${MPESA_CONSUMER_KEY:}
    consumer-secret: ${MPESA_CONSUMER_SECRET:}
    shortcode: ${MPESA_SHORTCODE:174379}
    passkey: ${MPESA_PASSKEY:}
    callback-base: ${MPESA_CALLBACK_BASE:}
    subscription-shortcode: ${MPESA_SUBSCRIPTION_SHORTCODE:}
    c2b-secret: ${MPESA_C2B_SECRET:}
    simulate-delay-ms: ${MPESA_SIMULATE_DELAY_MS:4000}
  # LeziTech's own PayHero account, for businesses paying their Lezi Suite plan by M-Pesa prompt.
  payhero:
    username: ${PAYHERO_USERNAME:}
    password: ${PAYHERO_PASSWORD:}
    channel-id: ${PAYHERO_CHANNEL_ID:0}
  cors-origins: ${CORS_ORIGINS:http://localhost:5320,http://127.0.0.1:5320}
  # Local embedded Postgres; ignored when DATABASE_URL points elsewhere.
  embedded-db:
    enabled: ${EMBEDDED_DB:true}
    port: 54329
    data-dir: ${EMBEDDED_DB_DIR:.localdb}
